# A Tailscale Service name for the server (rowanholt server init --service). `rowanholt start`
# layers this over docker-compose.server.yml when .env sets ROWANHOLT_SERVICE.
#
# The proxy's Service sites (Caddyfile.service) on the host's loopback only, where Tailscale hands
# them the name's requests: 5680 the web app, API and Eru's MCP server, 5681 Splunk, 5682 Kibana,
# 5683 the ATT&CK Navigator. The certificate and the ports the server already has don't change.

services:
  proxy:
    ports:
      - "127.0.0.1:5680-5683:5680-5683"
    volumes:
      - ./deploy/server/Caddyfile.service:/etc/caddy/service.caddy:ro
