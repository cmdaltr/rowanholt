# Builds the desktop app for macOS (.dmg), Windows (.msi) and Debian/Ubuntu (.deb), each
# carrying the source tree at this commit. A v* tag attaches them to a draft release;
# a manual run leaves them as workflow artifacts.
#
# Signing is optional and switches on with these secrets:
#   macOS:   MACOS_CERTIFICATE_P12 (base64 Developer ID Application .p12), MACOS_CERTIFICATE_PASSWORD,
#            MACOS_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)");
#            notarisation also needs APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific)
#   Windows: WINDOWS_CERTIFICATE_PFX (base64 code-signing .pfx), WINDOWS_CERTIFICATE_PASSWORD
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Source tarball
        run: app/source-tarball.sh rowanholt-src.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: rowanholt-src.tar.gz

  macos:
    needs: source
    runs-on: macos-14
    env:
      VERSION: ${{ needs.source.outputs.version }}
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: app/macos/package.sh --version "$VERSION" --source rowanholt-src.tar.gz dist
      - uses: actions/upload-artifact@v4
        with:
          name: rowanholt-macos
          path: dist/*.dmg

  linux:
    needs: source
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
      - name: Package
        run: app/linux/package-deb.sh --version "$VERSION" --source rowanholt-src.tar.gz dist
      - name: Check the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -E 'opt/rowanholt/|applications/rowanholt.desktop'
          dpkg-deb --fsys-tarfile dist/*.deb | tar -xO ./usr/share/applications/rowanholt.desktop | desktop-file-validate /dev/stdin || true
      - uses: actions/upload-artifact@v4
        with:
          name: rowanholt-linux
          path: dist/*.deb

  windows:
    needs: source
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.source.outputs.version }}
      HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source
      # WiX pinned, so a release builds with the toolset it was tested with
      - name: WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Build the MSI
        shell: pwsh
        run: app\windows\build-msi.ps1 -Version $env:VERSION -Tarball rowanholt-src.tar.gz -OutDir dist
      - name: Sign the MSI
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          try {
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 (Get-ChildItem dist\*.msi).FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $pfx
          }
      # Installed and removed with the scripts a user runs, from Windows PowerShell as theirs would.
      # The stack itself can't start here (the runner's Docker runs Windows containers only), so this
      # checks what the MSI puts down and takes away
      - name: Install, check and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem dist\*-windows-universal.msi).FullName
          & powershell -NoProfile -ExecutionPolicy Bypass -File app\install.ps1 -File $msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\cmdaltr\Rowanholt'
          $programs = [Environment]::GetFolderPath('Programs')
          $expected = @("$dir\app\windows\Rowanholt.ps1", "$dir\rowanholt-src.tar.gz", "$dir\LICENSE", "$dir\VERSION",
                        "$dir\seed\install.ps1", "$dir\seed\uninstall.ps1",
                        "$programs\Rowanholt.lnk", "$programs\Stop Rowanholt.lnk", "$programs\Set Up Rowanholt.lnk")
          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing) { throw "Not installed: $($missing -join ', ')" }
          if ((Get-Content "$dir\VERSION" -Raw).Trim() -ne $env:VERSION) { throw "VERSION isn't $env:VERSION" }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'Rowanholt' }
          if (-not $entry) { throw 'No Settings > Apps entry' }
          Write-Host "Installed $($entry.DisplayVersion); removing it"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\seed\uninstall.ps1" -Yes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $left = @($expected | Where-Object { Test-Path $_ })
          if ($left) { throw "Left behind: $($left -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: rowanholt-windows
          path: dist/*.msi

  release:
    if: github.ref_type == 'tag'
    needs: [source, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rowanholt-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Attach to a draft release
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --generate-notes --title "Rowanholt $VERSION"
          gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber
