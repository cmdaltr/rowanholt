# Builds the desktop app for macOS (.dmg), Windows (.msi) and Debian/Ubuntu (.deb), each
# carrying the source tree at this commit. A v* tag attaches them to a draft release;
# a manual run leaves them as workflow artifacts.
#
# Signing is optional and switches on with these secrets:
#   macOS:   MACOS_CERTIFICATE_P12 (base64 Developer ID Application .p12), MACOS_CERTIFICATE_PASSWORD,
#            MACOS_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)");
#            notarisation also needs APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific)
#   Windows: WINDOWS_CERTIFICATE_PFX (base64 code-signing .pfx), WINDOWS_CERTIFICATE_PASSWORD
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A release file itself (as Shikari's and Ostraka's), and what every package carries inside as
      # rowanholt-src.tar.gz; its top folder is rowanholt-<version>/
      - name: Source tarball
        run: desktop/source-tarball.sh "handoff/rowanholt-${{ steps.version.outputs.version }}-source.tar.gz" "${{ steps.version.outputs.version }}"
      # Jobs hand files to each other through the Actions cache, not artifacts: artifacts share the
      # account's 500 MB storage with every other repository (a busy sibling fills it and blocks every
      # upload here); the cache has 10 GB per repository that nothing else can fill. Shikari does the same
      - uses: actions/cache/save@v4
        with:
          path: handoff
          key: source-${{ github.run_id }}
          # Windows caches are partitioned from Unix ones; the Windows job restores this too
          enableCrossOsArchive: true

  macos:
    needs: source
    runs-on: macos-15  # macos-14 was retired; Shikari's builds use macos-15 too
    env:
      VERSION: ${{ needs.source.outputs.version }}
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: handoff
          key: source-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: desktop/macos/package.sh --version "$VERSION" --source "handoff/rowanholt-$VERSION-source.tar.gz" dist
      # Installed and removed with the scripts a user runs, as Shikari's smoke job does. The stack
      # can't start here (GitHub's macOS runners have no Docker), so this checks what the DMG puts
      # down and takes away
      - name: Install, check and uninstall
        run: |
          set -eux  # x: a check that fails without a message still shows which line it was
          sh desktop/install.sh --file dist/*-macos-universal.dmg
          app=/Applications/Rowanholt.app
          [ -d "$app" ] || app="$HOME/Applications/Rowanholt.app"
          [ -d "$app" ] || { echo "Rowanholt.app isn't installed"; exit 1; }
          archs=$(lipo -archs "$app"/Contents/MacOS/*)
          echo "Launcher: $archs"
          case " $archs " in *" x86_64 "*) ;; *) echo "not universal: no x86_64"; exit 1 ;; esac
          case " $archs " in *" arm64 "*) ;; *) echo "not universal: no arm64"; exit 1 ;; esac
          for f in LICENSE install.sh uninstall.sh; do
            [ -f "$app/Contents/Resources/$f" ] || { echo "Contents/Resources/$f is missing"; exit 1; }
          done
          # PlistBuddy, not defaults: defaults can fail on a bundle's Info.plist on a fresh runner, and
          # under set -e a failing $(...) ends the step with nothing said
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist") \
            || { echo "couldn't read the bundle id"; exit 1; }
          [ "$id" = io.github.cmdaltr.rowanholt ] || { echo "bundle id is $id"; exit 1; }
          codesign --verify --deep --strict "$app" || { echo "codesign --verify failed"; exit 1; }
          # The app's own uninstaller, copied out first as a user's would run: it deletes the app it's in
          cp "$app/Contents/Resources/uninstall.sh" "$RUNNER_TEMP/uninstall.sh"
          sh "$RUNNER_TEMP/uninstall.sh" --yes
          for left in /Applications/Rowanholt.app "$HOME/Applications/Rowanholt.app" \
                      "$HOME/Library/Preferences/io.github.cmdaltr.rowanholt.plist"; do
            [ ! -e "$left" ] || { echo "Left behind: $left"; exit 1; }
          done
          ! defaults read io.github.cmdaltr.rowanholt >/dev/null 2>&1 || { echo "Preferences left behind"; exit 1; }
      - uses: actions/cache/save@v4
        with:
          path: dist
          key: pkg-${{ github.run_id }}-macos
          enableCrossOsArchive: true

  linux:
    needs: source
    runs-on: ubuntu-22.04  # the oldest the .deb supports, as Shikari builds its .debs on
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: handoff
          key: source-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Package
        run: desktop/linux/package-deb.sh --version "$VERSION" --source "handoff/rowanholt-$VERSION-source.tar.gz" dist
      - name: Check the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -E 'opt/rowanholt/|applications/rowanholt.desktop'
          dpkg-deb --fsys-tarfile dist/*.deb | tar -xO ./usr/share/applications/rowanholt.desktop | desktop-file-validate /dev/stdin || true
      # Installed and removed with the scripts a user runs (apt pulls in the launcher's dependencies).
      # The stack isn't started: this checks what the .deb puts down and takes away
      - name: Install, check and uninstall
        run: |
          set -eu
          # The .deb's Depends are already on the runner; its Recommends (zenity, libnotify-bin) and
          # desktop-file-utils come from Ubuntu's archive, so an archive outage mustn't fail the
          # package's own test: recommends off for this runner, and the menu-entry check skipped
          # (with a warning) when desktop-file-utils can't be fetched
          echo 'APT::Install-Recommends "0";' | sudo tee /etc/apt/apt.conf.d/99-no-recommends >/dev/null
          validate=yes
          { sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils >/dev/null; } || {
            echo "::warning::Ubuntu's archive isn't answering: the menu entry isn't validated"; validate=no; }
          sh desktop/install.sh --file dist/*_all.deb
          for f in LICENSE install.sh uninstall.sh VERSION rowanholt-app.sh rowanholt-src.tar.gz; do
            [ -f "/opt/rowanholt/$f" ] || { echo "/opt/rowanholt/$f is missing"; exit 1; }
          done
          [ "$(cat /opt/rowanholt/VERSION)" = "$VERSION" ] || { echo "VERSION isn't $VERSION"; exit 1; }
          cmp /usr/share/doc/rowanholt/copyright LICENSE
          [ "$validate" = no ] || desktop-file-validate /usr/share/applications/rowanholt.desktop
          # The installed uninstaller, copied out first: purging the package deletes /opt/rowanholt
          cp /opt/rowanholt/uninstall.sh "$RUNNER_TEMP/uninstall.sh"
          sh "$RUNNER_TEMP/uninstall.sh" --yes
          ! dpkg -s rowanholt >/dev/null 2>&1 || { echo "rowanholt is still installed"; exit 1; }
          [ ! -e /opt/rowanholt ] || { echo "Left behind: /opt/rowanholt"; ls -la /opt/rowanholt; exit 1; }
          [ ! -e /usr/share/applications/rowanholt.desktop ] || { echo "Left behind: the menu entry"; exit 1; }
      - uses: actions/cache/save@v4
        with:
          path: dist
          key: pkg-${{ github.run_id }}-linux
          enableCrossOsArchive: true

  windows:
    needs: source
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.source.outputs.version }}
      HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: handoff
          key: source-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # WiX pinned, so a release builds with the toolset it was tested with
      - name: WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Build the MSI
        shell: pwsh
        run: desktop\windows\build-msi.ps1 -Version $env:VERSION -Tarball "handoff\rowanholt-$($env:VERSION)-source.tar.gz" -OutDir dist
      - name: Sign the MSI
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          try {
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 (Get-ChildItem dist\*.msi).FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $pfx
          }
      # Installed and removed with the scripts a user runs, from Windows PowerShell as theirs would.
      # The stack itself can't start here (the runner's Docker runs Windows containers only), so this
      # checks what the MSI puts down and takes away
      - name: Install, check and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem dist\*-windows-universal.msi).FullName
          & powershell -NoProfile -ExecutionPolicy Bypass -File desktop\install.ps1 -File $msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\cmdaltr\Rowanholt'
          $programs = [Environment]::GetFolderPath('Programs')
          $expected = @("$dir\desktop\windows\Rowanholt.ps1", "$dir\rowanholt-src.tar.gz", "$dir\LICENSE", "$dir\VERSION",
                        "$dir\seed\install.ps1", "$dir\seed\uninstall.ps1",
                        "$programs\Rowanholt.lnk", "$programs\Stop Rowanholt.lnk", "$programs\Set Up Rowanholt.lnk")
          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing) { throw "Not installed: $($missing -join ', ')" }
          if ((Get-Content "$dir\VERSION" -Raw).Trim() -ne $env:VERSION) { throw "VERSION isn't $env:VERSION" }
          # Settings > Apps lists what Windows Installer has registered: asked by the MSI's UpgradeCode
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $code = @($installer.RelatedProducts('{2960092C-3402-4618-A64F-289055BDD7C2}'))[0]
          if (-not $code) { throw 'No Settings > Apps entry' }
          if ($installer.ProductInfo($code, 'ProductName') -ne 'Rowanholt') { throw 'The registered product isn''t Rowanholt' }
          Write-Host "Installed $($installer.ProductInfo($code, 'VersionString')); removing it"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\seed\uninstall.ps1" -Yes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $left = @($expected | Where-Object { Test-Path $_ })
          if ($left) { throw "Left behind: $($left -join ', ')" }
          if (@($installer.RelatedProducts('{2960092C-3402-4618-A64F-289055BDD7C2}')).Count) { throw 'Still registered with Windows Installer' }
      - uses: actions/cache/save@v4
        with:
          path: dist
          key: pkg-${{ github.run_id }}-windows
          enableCrossOsArchive: true

  release:
    if: github.ref_type == 'tag'
    needs: [source, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # One restore per package, all into dist/ so they accumulate; no fail-on-cache-miss, so a
      # missing package shows as a missing release file rather than a failed restore
      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: pkg-${{ github.run_id }}-macos
          enableCrossOsArchive: true
      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: pkg-${{ github.run_id }}-linux
          enableCrossOsArchive: true
      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: pkg-${{ github.run_id }}-windows
          enableCrossOsArchive: true
      - uses: actions/cache/restore@v4
        with:
          path: handoff
          key: source-${{ github.run_id }}
          enableCrossOsArchive: true
      - name: The source tarball beside the packages
        run: cp handoff/rowanholt-*-source.tar.gz dist/
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Attach to a draft release
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --generate-notes --title "Rowanholt $VERSION"
          gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber
