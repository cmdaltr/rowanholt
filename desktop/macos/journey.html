<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Starting Rowanholt</title>
<style>
:root { --col: min(680px, 74vw); color-scheme: dark; --bg: #0b1210; --text: #b9c9b4; --dim: #7d907a; --strong: #e1ecdc;
        --bad: #e8a07a; --gold: #c9a44c; --track: #1d2b26; --line: #1d2b26; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
       background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, system-ui, sans-serif; padding: 24px; }
/* One column: the logo's artwork (the image less its ™, which hangs past the right) as wide as the
   bar, the status and the log under it */
.logo { width: calc(var(--col) * 1.14); max-height: 56vh; object-fit: contain; margin-bottom: 22px; }
.bar { width: var(--col); height: 8px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar div { height: 100%; width: 0; background: var(--gold); border-radius: 3px; }
.status { width: var(--col); margin-top: 20px; text-align: center; min-height: 84px; }
#where { font-size: 22px; color: var(--strong); }
#eta { margin-top: 4px; font-size: 18px; }
#phase { margin-top: 4px; color: var(--dim); font-size: 15px; }
.error #where { color: var(--bad); font-size: 18px; }
button { margin-top: 12px; padding: 6px 18px; background: #1d3a2e; color: #d6e6d0; border: 1px solid #2f5a47;
         border-radius: 6px; font: inherit; cursor: pointer; display: none; }
.error button { display: inline-block; }
details { width: var(--col); margin-top: 16px; color: var(--dim); }
summary { cursor: pointer; font-size: 13px; text-align: center; }
pre { height: 26vh; overflow: auto; margin: 8px 0 0; padding: 12px; background: #050908; border: 1px solid var(--line);
      border-radius: 6px; font: 12px "JetBrains Mono", Menlo, monospace; color: #8fa58a; white-space: pre-wrap; }
.plain .bar { display: none; }
</style>
</head>
<body>
<img class="logo" src="rowanholt.png" alt="Rowanholt">
<div class="bar" id="bar"><div id="fill"></div></div>
<div class="status" id="status">
  <div id="where">Starting Rowanholt</div>
  <div id="eta">Working out the time left…</div>
  <div id="phase"></div>
  <button onclick="webkit.messageHandlers.rowanholt.postMessage('retry')">Try again</button>
</div>
<details>
  <summary>The start's log</summary>
  <pre id="log"></pre>
</details>
<script>
let shown = 0, target = 0, lastReport = 0, startedAt = Date.now(), failed = false, finished = false;
// A typical start on this Mac, for moving without reports (expect() from Rowanholt.app)
let typical = 150;

function frame() {
  // Ease towards the reported fraction; with no reports (no Python for the timings), move
  // on by elapsed time against this Mac's typical start so the bar still moves
  if (!lastReport && !failed && !finished) {
    const elapsed = (Date.now() - startedAt) / 1000;
    if (elapsed > 5) {
      target = Math.min(0.95, elapsed / typical);
      const left = typical - elapsed;
      document.getElementById('eta').textContent = left > 0 ? formatEta(left) : 'Nearly there';
    }
  }
  shown += (target - shown) * 0.06;
  if (Math.abs(target - shown) < 0.0005) shown = target;
  document.getElementById('fill').style.width = `${(Math.max(0, Math.min(1, shown)) * 100).toFixed(1)}%`;
  requestAnimationFrame(frame);
}

function formatEta(seconds) {
  if (seconds <= 0) return 'Ready';
  if (seconds < 45) return 'Less than a minute left';
  if (seconds < 90) return 'About a minute left';
  const minutes = Math.round(seconds / 60);
  return minutes < 60 ? `About ${minutes} minutes left` : `About ${Math.floor(minutes / 60)} h ${minutes % 60} min left`;
}

// From Rowanholt.app: the median of this Mac's earlier starts, in seconds
function expect(seconds) { if (seconds > 0) typical = seconds; }

// From Rowanholt.app: one @@progress report from startup_progress.py
function progress(r) {
  lastReport = Date.now();
  target = Math.max(target, r.fraction);
  finished = r.fraction >= 1;
  document.getElementById('where').textContent = finished ? 'Rowanholt is ready' : 'Starting Rowanholt';
  // A step well past its estimate says so (startup_progress.Journey.overrun), as on Windows
  document.getElementById('eta').textContent = r.overrun && !finished
    ? `Taking longer than expected; still working (${r.overrun} min on this step)`
    : formatEta(r.eta) + (r.learning && !finished ? ' (a first guess: this Mac has no timings yet)' : '');
  document.getElementById('phase').textContent = r.message;
}

function line(t) { const l = document.getElementById('log'); l.textContent += t + '\n'; l.scrollTop = l.scrollHeight; }

function status(t, error) {
  failed = !!error;
  document.getElementById('status').classList.toggle('error', failed);
  document.getElementById('where').textContent = t;
  if (failed) {
    document.getElementById('eta').textContent = '';
    document.getElementById('phase').textContent = 'The log below says what happened.';
    document.querySelector('details').open = true;
  } else if (document.body.classList.contains('plain')) {
    document.getElementById('phase').textContent = '';
  } else if (!lastReport) {
    document.getElementById('phase').textContent = t;
    document.getElementById('where').textContent = 'Starting Rowanholt';
  }
}

// Stopping the stack or connecting to a server: no progress bar, just the words
function plain(t) {
  document.body.classList.add('plain');
  document.getElementById('where').textContent = t;
  document.getElementById('eta').textContent = '';
  finished = true;
}

requestAnimationFrame(frame);
</script>
</body>
</html>
