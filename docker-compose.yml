# Fixed, so volumes and Andúril's project label don't follow the checkout's folder name
name: rowanholt

services:
  # PostgreSQL for job state storage
  postgres:
    image: postgres:16-alpine
    container_name: rowanholt-postgres
    ports:
      # This machine only: without sign-in (local mode) nothing here is for the network
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=rowanholt
      - POSTGRES_USER=rowanholt
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rowanholt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rowanholt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rowanholt"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Redis for Celery task queue
  redis:
    image: redis:7-alpine
    container_name: rowanholt-redis
    ports:
      # This machine only: anyone who reaches Redis can queue the worker's tasks
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rowanholt-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # Backend API
  backend:
    build:
      context: ./src/web/backend
      dockerfile: Dockerfile
    container_name: rowanholt-backend
    ports:
      # This machine only. Outside server mode the API answers anyone who reaches it, as the local
      # analyst (an admin): it isn't published to the network. A team server publishes nothing but
      # its proxy (deploy/server/docker-compose.server.yml resets these)
      - "127.0.0.1:5688:5688"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://rowanholt:${POSTGRES_PASSWORD:-rowanholt}@postgres:5432/rowanholt
      - ROWANHOLT_EVIDENCE_PATHS=${ROWANHOLT_EVIDENCE_PATHS:-}
      # JWT signing key. Docker administration stays disabled until this is changed.
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ANDURIL_URL=http://anduril:5690
      # Smith's model (docs/SMITH.md): set these in .env or the environment to change them
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - ROWANHOLT_MODEL_NAME=${ROWANHOLT_MODEL_NAME:-llama3.2:3b}
      - ROWANHOLT_NUM_CTX=${ROWANHOLT_NUM_CTX:-8192}
      # Shown on Aragorn's symbol tables (the worker's setting, which it acts on)
      - ROWANHOLT_SYMBOL_DOWNLOADS=${ROWANHOLT_SYMBOL_DOWNLOADS:-on}
      # Sample data (rowanholt samples, Aragorn): a folder the worker reads as well
      - ROWANHOLT_SAMPLES_DIR=${ROWANHOLT_SAMPLES_DIR:-/tmp/rowanholt/samples}
      # Online lookups (.env.example): Pippin's VirusTotal button needs "virustotal" and the key
      - ROWANHOLT_ONLINE_LOOKUPS=${ROWANHOLT_ONLINE_LOOKUPS:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
    volumes:
      - ./src/web/backend:/app
      - ./src/mordor:/opt/rowanholt/src/mordor # Mordor: recorded attack telemetry (/api/mordor/telemetry)
      - ./src/analysis/rowanholt/threat_intel:/opt/elrond-src/rowanholt/threat_intel:ro # threat intelligence parsing (/api/threat-intel)
      - ./src/analysis/rowanholt/core:/opt/elrond-src/rowanholt/core:ro # reading case tables (rowanholt/core/records.py)
      - ./src/analysis/rowanholt/report:/opt/elrond-src/rowanholt/report:ro # the case report (/api/jobs/{id}/case/full-report)
      - ./src/analysis/rowanholt/post/mitre:/opt/elrond-src/rowanholt/post/mitre:ro # the pinned ATT&CK release: technique names in the report, Navigator layers
      - ./src/analysis/rowanholt/memory/symbols:/opt/elrond-src/rowanholt/memory/symbols:ro # the symbol tables' index (/api/symbols)
      - ./src/analysis/rowanholt/samples:/opt/elrond-src/rowanholt/samples:ro # the sample data catalogue (/api/samples)
      - ./symbols:/opt/rowanholt/symbols # Volatility symbol tables: Aragorn lists them and takes uploads (incoming/, built by the worker)
      - anduril_token:/run/anduril:ro # Written by anduril
      # Platform-specific mounts - uncomment for your OS:
      # - /mnt:/mnt:ro              # Linux: Mount points (read-only)
      # - /media:/media:ro          # Linux: Ubuntu/Debian mounts (read-only)
      - /Volumes:/Volumes:ro # macOS: External drives (read-only)
      # - D:/:/mnt/d:ro             # Windows: Mount D: drive (example, adjust as needed)
      - /tmp/rowanholt:/tmp/elrond/output # Output directory (accessible at /tmp/rowanholt on host)
      - /tmp/rowanholt:/tmp/rowanholt:ro # Mount for test images in /tmp/rowanholt
      - /tmp/rowanholt:/host/tmp/rowanholt # Also mount at /host/tmp/rowanholt for frontend compatibility
      - rowanholt_uploads:/tmp/elrond/uploads # Upload directory
    depends_on:
      - redis
      - postgres
    networks:
      - rowanholt-network
      - rowanholt-anduril
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 5688 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway" # Lab agent on the host (Docker Desktop adds this itself; Linux needs it)
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 256M

  # Anduril administers Rowanholt's own containers and images.
  # Opt-in: it holds the Docker socket, which is root-equivalent on the Docker
  # VM. Enable with `rowanholt anduril enable` (or --profile anduril). It is only
  # reachable from the backend over the internal rowanholt-anduril network and
  # refuses anything not labelled com.docker.compose.project=rowanholt.
  anduril:
    profiles: [anduril]
    build:
      context: .
      dockerfile: src/web/anduril/Dockerfile
    container_name: rowanholt-anduril
    environment:
      - ROWANHOLT_COMPOSE_PROJECT=rowanholt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Docker Desktop and OrbStack both expose this path
      - anduril_token:/run/anduril
    networks:
      - rowanholt-anduril
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64M

  # Celery worker for background tasks (forensics-enabled)
  celery-worker:
    build:
      context: .
      dockerfile: src/web/backend/Dockerfile.forensics
    container_name: rowanholt-celery-worker
    privileged: true # Required for mounting forensic images
    devices:
      - /dev/fuse:/dev/fuse # Required for FUSE mounts
    cap_add:
      - SYS_ADMIN # Required for loop device mounts
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://rowanholt:${POSTGRES_PASSWORD:-rowanholt}@postgres:5432/rowanholt
      - ROWANHOLT_EVIDENCE_PATHS=${ROWANHOLT_EVIDENCE_PATHS:-}
      - SPLUNK_HOST=splunk
      - SPLUNK_PORT=8089
      - SPLUNK_USERNAME=admin
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-rowanholt}
      - ELASTICSEARCH_HOST=elastic
      - ELASTICSEARCH_PORT=9200
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-rowanholt}
      # OpenSearch (or Wazuh's indexer) and Timesketch, elsewhere: --OpenSearch and --Timesketch (.env.example)
      - OPENSEARCH_URL=${OPENSEARCH_URL:-}
      - OPENSEARCH_USERNAME=${OPENSEARCH_USERNAME:-}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-}
      - OPENSEARCH_CA=${OPENSEARCH_CA:-}
      - OPENSEARCH_VERIFY=${OPENSEARCH_VERIFY:-true}
      - OPENSEARCH_INDEX_PREFIX=${OPENSEARCH_INDEX_PREFIX:-rowanholt-}
      - OPENSEARCH_DASHBOARDS_URL=${OPENSEARCH_DASHBOARDS_URL:-}
      - TIMESKETCH_URL=${TIMESKETCH_URL:-}
      - TIMESKETCH_USERNAME=${TIMESKETCH_USERNAME:-}
      - TIMESKETCH_PASSWORD=${TIMESKETCH_PASSWORD:-}
      - TIMESKETCH_CA=${TIMESKETCH_CA:-}
      - TIMESKETCH_VERIFY=${TIMESKETCH_VERIFY:-true}
      # Set to 'true' to exclude cache directories from user profile copies (faster but less complete)
      - ROWANHOLT_EXCLUDE_PROFILE_CACHE=true
      # Elrond's DNS lookups of extracted IOCs: only when the list includes "dns" (.env.example)
      - ROWANHOLT_ONLINE_LOOKUPS=${ROWANHOLT_ONLINE_LOOKUPS:-}
      # Volatility symbol tables fetched for a memory image's kernel (memory/symbols: hash-checked,
      # audit-logged); off also runs Volatility --offline (no Windows PDBs). Team servers: off
      - ROWANHOLT_SYMBOL_DOWNLOADS=${ROWANHOLT_SYMBOL_DOWNLOADS:-on}
      # Sample data: Aragorn's fetches download here (rowanholt/samples)
      - ROWANHOLT_SAMPLES_DIR=${ROWANHOLT_SAMPLES_DIR:-/tmp/rowanholt/samples}
    volumes:
      - ./src/web/backend:/app
      # NOTE: elrond source is now copied into the image during build (see Dockerfile.forensics)
      # to avoid OneDrive file locking conflicts with Docker VirtioFS on macOS
      # Platform-specific mounts - uncomment for your OS:
      # - /mnt:/mnt                 # Linux: Mount points (read-write for output)
      # - /media:/media             # Linux: Ubuntu/Debian mounts (read-write for output)
      - /Volumes:/Volumes # macOS: External drives (read-write for output) - COMMENT OUT ON LINUX/WINDOWS
      # - D:/:/mnt/d                # Windows: Mount D: drive (example, adjust as needed)
      - /tmp/rowanholt:/tmp/elrond/output # Output directory (accessible at /tmp/rowanholt on host)
      - /tmp/rowanholt:/tmp/rowanholt # Mount for test images in /tmp/rowanholt
      - ./fixtures:/tmp/rowanholt/fixtures:ro # Keywords, YARA rules, IOC watchlists for analysis
      # Volatility 3 symbol tables (ISF) for Linux and macOS memory, which it can't fetch
      # itself as it does Windows PDBs (E14): fetched or built into these (memory/symbols, each
      # folder's rowanholt.index and rowanholt-symbols.log), kept here so rebuilds don't lose them
      - ./symbols/linux:/usr/local/lib/python3.10/dist-packages/volatility3/symbols/linux
      - ./symbols/mac:/usr/local/lib/python3.10/dist-packages/volatility3/symbols/mac
      # The Windows tables Volatility converts from Microsoft's PDBs, and its banner cache
      - volatility_windows:/usr/local/lib/python3.10/dist-packages/volatility3/symbols/windows
      - volatility_cache:/root/.cache/volatility3
      - ./symbols:/opt/rowanholt/symbols # Aragorn's uploads (incoming/), at the backend's path
      - rowanholt_uploads:/tmp/elrond/uploads # For uploaded forensic images
      - splunk_etc:/opt/splunk/etc
      - splunk_var:/opt/splunk/var
      - navigator_data:/navigator # Shared with navigator for ATT&CK Navigator JSON output
    depends_on:
      - redis
      - postgres
      - backend
    networks:
      - rowanholt-network
    restart: unless-stopped
    # Override PYTHONPATH to prioritize /app over /opt/elrond-src to avoid module conflicts
    command: sh -c 'cd /app && PYTHONPATH=/app exec /usr/bin/python3 -m celery -A tasks_docker.celery_app worker --loglevel=info'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # Frontend
  frontend:
    build:
      context: ./src/web/frontend
      dockerfile: Dockerfile
    container_name: rowanholt-frontend
    ports:
      # This machine only, like the API: the dev server is the local analyst's web app
      - "127.0.0.1:5687:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5688
    volumes:
      - ./src/web/frontend/src:/app/src
      - ./src/web/frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - rowanholt-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # The dev server's webpack compile peaks above 512M (Rocky 9 on arm64 was OOM-killed)
          memory: 1G

  # Splunk Enterprise
  splunk:
    profiles: [siem]
    image: splunk/splunk:latest
    platform: linux/amd64
    container_name: rowanholt-splunk
    hostname: splunk
    ports:
      # This machine only: .env.example's default password is changeme, and a team server puts
      # Splunk, Kibana and the Navigator behind its proxy and sign-in instead
      - "127.0.0.1:8089:8089" # Splunk API
      - "127.0.0.1:7755:8000" # Splunk Web
      - "127.0.0.1:9997:9997" # Splunk Forwarder
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-rowanholt}
    volumes:
      - splunk_etc:/opt/splunk/etc
      - splunk_var:/opt/splunk/var
      - /tmp/rowanholt:/tmp/elrond/output:ro # Mount output directory for monitoring
      # Custom output destinations, mounted where the worker mounts them (E10); add
      # any other root to SPLUNK_MONITOR_ROOTS on the worker
      - /Volumes:/Volumes:ro # macOS: External drives - COMMENT OUT ON LINUX/WINDOWS
      # - /mnt:/mnt:ro            # Linux
      # - /media:/media:ro        # Linux: Ubuntu/Debian mounts
    networks:
      - rowanholt-network
    restart: unless-stopped
    # The image's checkstate.sh runs as 'ansible', which can't read splunk-owned
    # /opt/splunk/var/log, so it reports unhealthy while splunkd is fine.
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -o /dev/null -u admin:$$SPLUNK_PASSWORD https://localhost:8089/services/server/health/splunkd || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # Elasticsearch
  elastic:
    profiles: [siem]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: rowanholt-elastic
    hostname: elastic
    ports:
      - "127.0.0.1:9200:9200" # this machine only, as Splunk
      - "127.0.0.1:9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-rowanholt}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - rowanholt-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -q ''"status"''',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Elasticsearch setup - initializes passwords for built-in users
  elastic-setup:
    profiles: [siem]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: rowanholt-elastic-setup
    depends_on:
      elastic:
        condition: service_healthy
    networks:
      - rowanholt-network
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-rowanholt}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD:-rowanholt}
    command: >
      bash -c '
        echo "Waiting for Elasticsearch to be ready...";
        until curl -s -u elastic:$$ELASTIC_PASSWORD http://elastic:9200/_cluster/health | grep -q "status"; do
          sleep 5;
        done;
        echo "Setting kibana_system password...";
        curl -s -X POST -u elastic:$$ELASTIC_PASSWORD -H "Content-Type: application/json" \
          http://elastic:9200/_security/user/kibana_system/_password \
          -d "{\"password\": \"$$KIBANA_PASSWORD\"}" || true;
        echo "Creating admin user with superuser role...";
        curl -s -X POST -u elastic:$$ELASTIC_PASSWORD -H "Content-Type: application/json" \
          http://elastic:9200/_security/user/admin \
          -d "{\"password\": \"$$ELASTIC_PASSWORD\", \"roles\": [\"superuser\"], \"full_name\": \"Admin User\"}" || true;
        echo "Elasticsearch setup complete!";
      '
    restart: "no"

  # Kibana
  kibana:
    profiles: [siem]
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: rowanholt-kibana
    hostname: kibana
    ports:
      - "127.0.0.1:5601:5601" # this machine only, as Splunk
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-rowanholt}
      - SERVER_NAME=rowanholt-kibana
      - XPACK_SECURITY_ENABLED=true
    depends_on:
      elastic:
        condition: service_healthy
    networks:
      - rowanholt-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:5601/api/status | grep -q 'available'",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M

  # Kibana dashboard setup - imports Rowanholt dashboards
  kibana-setup:
    profiles: [siem]
    image: curlimages/curl:latest
    container_name: rowanholt-kibana-setup
    depends_on:
      kibana:
        condition: service_healthy
    networks:
      - rowanholt-network
    environment:
      - KIBANA_URL=http://kibana:5601
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-rowanholt}
    volumes:
      - ./src/web/kibana:/dashboards:ro
    command: >
      sh -c '
        echo "Rowanholt Kibana Dashboard Setup";
        echo "=================================";

        echo "Importing Rowanholt dashboards...";
        response=$$(curl -s -X POST \
          -u "elastic:$$ELASTIC_PASSWORD" \
          "http://kibana:5601/api/saved_objects/_import?overwrite=true" \
          -H "kbn-xsrf: true" \
          --form file=@/dashboards/dashboards.ndjson);

        if echo "$$response" | grep -q "success.*true"; then
          echo "Dashboards imported successfully!";
        else
          echo "Dashboard import response: $$response";
        fi;

        echo "Setting default index pattern...";
        curl -s -X POST \
          -u "elastic:$$ELASTIC_PASSWORD" \
          "http://kibana:5601/api/kibana/settings" \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d "{\"changes\":{\"defaultIndex\":\"rowanholt-index-pattern\"}}" > /dev/null;

        echo "";
        echo "Kibana setup complete!";
        echo "  - Overview: http://localhost:5601/app/dashboards#/view/rowanholt-overview";
        echo "  - MITRE ATT&CK: http://localhost:5601/app/dashboards#/view/rowanholt-mitre";
        echo "  - Analysis: http://localhost:5601/app/dashboards#/view/rowanholt-analysis";
        echo "  - IoCs: http://localhost:5601/app/dashboards#/view/rowanholt-iocs";
        echo "  - Keywords: http://localhost:5601/app/dashboards#/view/rowanholt-keywords";
        echo "  - YARA: http://localhost:5601/app/dashboards#/view/rowanholt-yara";
        echo "  - Actors: http://localhost:5601/app/dashboards#/view/rowanholt-actors";
      '
    restart: "no"

  # ATT&CK Navigator
  navigator:
    profiles: [siem]
    image: node:18-alpine
    container_name: rowanholt-navigator
    hostname: navigator
    ports:
      - "127.0.0.1:5602:4200" # this machine only, as Splunk
    working_dir: /navigator
    volumes:
      - navigator_data:/navigator
    networks:
      - rowanholt-network
    restart: unless-stopped
    command: >
      sh -c "
      if [ ! -d 'attack-navigator' ]; then
        echo 'Cloning ATT&CK Navigator...' &&
        apk add --no-cache git curl &&
        git clone --depth 1 --branch v5.3.2 https://github.com/mitre-attack/attack-navigator.git &&
        cd attack-navigator/nav-app &&
        echo 'Installing dependencies...' &&
        npm install &&
        echo 'Building Navigator (this may take a few minutes)...' &&
        NODE_OPTIONS='--max-old-space-size=3072' npm run build -- --output-path=/navigator/dist;
      fi &&
      if [ \"$$(cat /navigator/dist/assets/attack-release 2>/dev/null)\" != '20.1' ]; then
        echo 'Downloading MITRE ATT&CK v20.1 (Enterprise and Mobile)...' &&
        apk add --no-cache curl &&
        mkdir -p /navigator/dist/assets &&
        for d in enterprise mobile; do
          curl -fsSL \"https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/$$d-attack/$$d-attack-20.1.json\" -o \"/navigator/dist/assets/$$d-attack.json\" || exit 1;
        done &&
        echo 20.1 > /navigator/dist/assets/attack-release;
      fi &&
      echo 'Serving Navigator on port 4200...' &&
      npx serve -s /navigator/dist -l 4200
      "
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  postgres_data:
  redis_data:
  rowanholt_output:
  rowanholt_uploads:
  splunk_etc:
  splunk_var:
  elastic_data:
  navigator_data:
  anduril_token:
  volatility_windows:
  volatility_cache:

networks:
  rowanholt-network:
    driver: bridge
  # Backend <-> anduril only; no route out and nothing published.
  rowanholt-anduril:
    driver: bridge
    internal: true
